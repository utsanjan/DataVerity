name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
env:
  BASE_URL: ${{ secrets.BASE_URL }}
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Verify Playwright configuration
      run: npm run test:list
    - name: Run Playwright tests
      # The Promo Pulse app is not reachable from GitHub-hosted runners by default,
      # so the live suite only runs when BASE_URL is configured as a repository secret.
      if: ${{ env.BASE_URL != '' }}
      run: npx playwright test
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
        TEST_USER: ${{ secrets.TEST_USER }}
        TEST_PASS: ${{ secrets.TEST_PASS }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: artifacts/reports/playwright/
        retention-days: 30
